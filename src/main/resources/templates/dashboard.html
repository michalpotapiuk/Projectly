<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pulpit')}"></head>
<body><nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container"><div th:replace="~{fragments/layout :: messages}"></div>
<p class="eyebrow">PRZEGLĄD PRACY</p><h1>Pulpit</h1>
<p class="muted" th:text="${isAdmin ? 'Statystyki wszystkich projektów i zadań.' : 'Twoje projekty i przypisane zadania.'}"></p>
<div class="stats">
<a class="stat" th:href="@{/projects}"><span>Dostępne projekty</span><strong th:text="${projectCount}">0</strong></a>
<a class="stat" th:href="${isAdmin ? '/tasks' : '/my-tasks'}"><span>Zadania</span><strong th:text="${taskCount}">0</strong></a>
<div class="stat"><span>Do zrobienia</span><strong th:text="${TODO}">0</strong></div>
<div class="stat"><span>W trakcie</span><strong th:text="${IN_PROGRESS}">0</strong></div>
<div class="stat"><span>Gotowe</span><strong th:text="${DONE}">0</strong></div>
</div>
<div class="panel"><h2>Od czego zaczynamy?</h2><p>Sprawdź swoje zadania i zaktualizuj postęp prac.</p>
<a class="button" th:href="@{/my-tasks}">Przejdź do moich zadań →</a>
<a class="button secondary" th:href="@{/projects}">Zobacz projekty</a></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
