<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Formularz zadania')}"></head>
<body><nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container"><div th:replace="~{fragments/layout :: messages}"></div>
<a class="back" th:href="@{/projects/{id}(id=${project.id})}">← Projekt</a><h1 th:text="${taskId == null ? 'Nowe zadanie' : 'Edytuj zadanie'}"></h1><p class="muted" th:text="${project.name}"></p>
<form class="panel form-panel" method="post" th:action="${taskId == null ? '/projects/' + project.id + '/tasks' : '/tasks/' + taskId + '/edit'}" th:object="${form}">
<div th:replace="~{fragments/layout :: formErrors}"></div>
<label for="title">Tytuł</label><input id="title" type="text" th:field="*{title}" required maxlength="160"><span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span><label for="description">Opis</label><textarea id="description" th:field="*{description}" rows="4" maxlength="2000"></textarea><span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
<label for="assignedUserId">Wykonawca</label><select id="assignedUserId" th:field="*{assignedUserId}"><option value="">Nieprzypisane</option><option th:each="user : ${users}" th:value="${user.id}" th:text="${user.username}"></option></select><span class="field-error" th:if="${#fields.hasErrors('assignedUserId')}" th:errors="*{assignedUserId}"></span>
<label for="status">Status</label><select id="status" th:field="*{status}" required><option th:each="status : ${statuses}" th:value="${status}" th:text="#{__${'status.' + status}__}"></option></select><span class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
<label for="priority">Priorytet</label><select id="priority" th:field="*{priority}" required><option th:each="priority : ${priorities}" th:value="${priority}" th:text="#{__${'priority.' + priority}__}"></option></select><span class="field-error" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></span>
<label for="deadline">Termin</label><input id="deadline" type="date" th:field="*{deadline}" ><span class="field-error" th:if="${#fields.hasErrors('deadline')}" th:errors="*{deadline}"></span>
<div class="actions"><button>Zapisz zadanie</button><a th:href="@{/projects/{id}(id=${project.id})}">Anuluj</a></div></form>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
